<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NubaraPlay</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --surface-2:#1a1a24;
  --border:#2a2a35;
  --text:#ffffff;
  --text-dim:#8a8a9a;
  --accent:#6366f1;
  --accent-glow:rgba(99,102,241,0.3);
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}

/* Layout asimétrico */
.app{display:grid;grid-template-columns:280px 1fr 380px;grid-template-rows:60px 1fr;height:100vh;gap:0}

/* Header */
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.header-actions{display:flex;gap:12px;align-items:center}
.header-btn{padding:8px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .2s}
.header-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.user-info{display:flex;align-items:center;gap:12px;font-size:13px}
.user-badge{padding:4px 10px;background:var(--accent);color:#fff;border-radius:4px;font-size:11px;font-weight:700}
.clock{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text-dim)}

/* Sidebar */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:20px 0;overflow-y:auto}
.nav-section{margin-bottom:24px}
.nav-label{padding:0 20px;font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:rgba(99,102,241,0.1);border-left-color:var(--accent);color:var(--accent)}
.nav-item .icon{font-size:18px;width:24px;text-align:center}
.nav-item .label{font-size:14px;font-weight:500}

/* Main content */
.main{display:flex;flex-direction:column;overflow:hidden}
.player-container{flex:1;display:flex;flex-direction:column;padding:20px;gap:16px;min-height:0}
.player-wrapper{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-height:calc(100vh - 280px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.player-wrapper iframe{width:100%;height:100%;border:none}
.player-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.8) 100%);pointer-events:none;opacity:0;transition:opacity .3s}
.player-wrapper:hover .player-overlay{opacity:1}
.player-info{position:absolute;bottom:0;left:0;right:0;padding:20px;transform:translateY(100%);transition:transform .3s}
.player-wrapper:hover .player-info{transform:translateY(0)}
.player-title{font-size:20px;font-weight:700;margin-bottom:4px}
.player-category{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.player-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-dim);background:var(--surface)}
.player-empty .icon{font-size:48px;opacity:0.3}
.player-empty .text{font-size:14px}

/* Controls */
.controls{display:flex;align-items:center;gap:12px;padding:0 4px}
.ctrl-btn{padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
.ctrl-btn:hover{background:var(--surface-2);border-color:var(--accent);transform:translateY(-1px)}
.ctrl-btn:active{transform:translateY(0)}
.ctrl-btn.primary{background:var(--accent);border-color:var(--accent)}
.ctrl-btn.primary:hover{background:#5558e6}
.ctrl-btn kbd{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;background:rgba(255,255,255,0.1);border-radius:3px;color:var(--text-dim)}
.zoom-control{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.zoom-control button{width:28px;height:28px;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:4px;font-size:16px}
.zoom-control button:hover{background:var(--surface-2)}
.zoom-control span{font-family:'JetBrains Mono',monospace;font-size:13px;min-width:48px;text-align:center}

/* Categories */
.categories{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px}
.cat-chip{padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;color:var(--text-dim);cursor:pointer;transition:all .15s}
.cat-chip:hover{border-color:var(--accent);color:var(--text)}
.cat-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Channel list */
.channel-panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.panel-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim)}
.search-box{padding:12px 20px;border-bottom:1px solid var(--border)}
.search-input{width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text-dim)}
.channel-list{flex:1;overflow-y:auto;padding:12px}
.channel-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:6px;border:2px solid transparent;position:relative}
.channel-item:hover{background:var(--surface-2)}
.channel-item.focused{background:rgba(99,102,241,0.15);border-color:var(--accent)}
.channel-item.playing{background:rgba(16,185,129,0.1);border-color:var(--success)}
.channel-item.playing::before{content:'▶';position:absolute;right:12px;color:var(--success);font-size:12px}
.channel-logo{width:52px;height:40px;background:var(--surface-2);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.channel-logo img{max-width:90%;max-height:90%;object-fit:contain}
.channel-info{flex:1;min-width:0}
.channel-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-cat{font-size:11px;color:var(--text-dim);margin-top:2px}

/* Keyboard hints */
.kbd-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:16px;padding:10px 20px;background:rgba(18,18,26,0.95);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(10px);font-size:11px;color:var(--text-dim);z-index:100}
.kbd-bar span{display:flex;align-items:center;gap:6px}
.kbd-bar kbd{font-family:'JetBrains Mono',monospace;padding:2px 6px;background:var(--surface-2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:10px}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* Loading indicator */
.loading-bar{position:absolute;top:0;left:0;height:2px;background:var(--accent);animation:loading 1.5s ease-in-out infinite;opacity:0}
.loading-bar.active{opacity:1}
@keyframes loading{0%{width:0;left:0}50%{width:70%;left:30%}100%{width:0;left:100%}}

/* Responsive */
@media(max-width:1200px){.app{grid-template-columns:240px 1fr 320px}}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:60px auto 1fr auto}.sidebar,.channel-panel{display:none}}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="logo">Nubara<span>Play</span></div>
    <div class="header-actions">
      <button class="header-btn" id="btnVolver">← Volver</button>
      <button class="header-btn" id="btnHistorial">Historial</button>
    </div>
    <div class="user-info">
      <span class="user-badge" id="userInfo">USUARIO</span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="nav-section">
      <div class="nav-label">Navegación</div>
      <div class="nav-item active" data-view="tv">
        <span class="icon">📺</span>
        <span class="label">TV en Vivo</span>
      </div>
      <div class="nav-item" data-view="destacados">
        <span class="icon">⭐</span>
        <span class="label">Destacados</span>
      </div>
      <div class="nav-item" data-view="agenda">
        <span class="icon">📅</span>
        <span class="label">Agenda</span>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Biblioteca</div>
      <a class="nav-item" href="genero.html">
        <span class="icon">🎬</span>
        <span class="label">Películas</span>
      </a>
      <div class="nav-item" data-view="historial">
        <span class="icon">🕐</span>
        <span class="label">Historial</span>
      </div>
    </div>
    <div class="nav-section" style="margin-top:auto">
      <div class="nav-item danger" id="btnSalir">
        <span class="icon">⏻</span>
        <span class="label">Salir</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="player-container">
      <div class="player-wrapper" id="playerWrapper">
        <div class="loading-bar" id="loadingBar"></div>
        <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <div class="player-overlay"></div>
        <div class="player-info">
          <div class="player-title" id="playerTitle">Selecciona un canal</div>
          <div class="player-category" id="playerCategory">Usa las flechas del teclado para navegar</div>
        </div>
        <div class="player-empty" id="playerEmpty">
          <div class="icon">📡</div>
          <div class="text">Selecciona un canal para comenzar</div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="btnPrev">⏮ Anterior <kbd>←</kbd></button>
        <button class="ctrl-btn" id="btnNext">Siguiente ⏭ <kbd>→</kbd></button>
        <button class="ctrl-btn" id="btnMute">🔊 <kbd>M</kbd></button>
        <div class="zoom-control">
          <button id="btnZoomOut">−</button>
          <span id="zoomVal">100%</span>
          <button id="btnZoomIn">+</button>
        </div>
        <button class="ctrl-btn" id="btnFav">☆ Favorito <kbd>F</kbd></button>
        <button class="ctrl-btn primary" id="btnFullscreen">⛶ Pantalla Completa</button>
      </div>

      <div class="categories" id="categories"></div>
    </div>
  </main>

  <!-- Channel Panel -->
  <aside class="channel-panel">
    <div class="panel-header">
      <div class="panel-title">Canales</div>
      <div class="panel-count" id="channelCount">0</div>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar canal...">
    </div>
    <div class="channel-list" id="channelList"></div>
  </aside>
</div>

<div class="kbd-bar">
  <span><kbd>↑</kbd><kbd>↓</kbd> Navegar</span>
  <span><kbd>←</kbd><kbd>→</kbd> Cambiar canal</span>
  <span><kbd>Enter</kbd> Reproducir</span>
  <span><kbd>M</kbd> Mute</span>
  <span><kbd>F</kbd> Favorito</span>
  <span><kbd>Esc</kbd> Salir</span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);

// Auth
const savedUser=localStorage.getItem('nubaraPlayUser');
if(!savedUser){window.location.href='index.html'}
else{$('userInfo').textContent=JSON.parse(savedUser).tipo==='demo'?'DEMO':'PREMIUM'}
$('btnSalir').onclick=()=>{localStorage.removeItem('nubaraPlayUser');location.href='index.html'};
$('btnVolver').onclick=()=>history.back();

// Firebase
const firebaseConfig={apiKey:"AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",authDomain:"nubaraplay.firebaseapp.com",projectId:"nubaraplay",storageBucket:"nubaraplay.firebasestorage.app",messagingSenderId:"873822057409",appId:"1:873822057409:web:f854a974f457eedd0c7540"};
try{firebase.initializeApp(firebaseConfig)}catch(e){}
const db=firebase.firestore();

// State
let channels=[],events=[];
let currentView='tv',currentCat='Todos',searchQuery='';
let zoom=100,muted=false,playingId=null,focusedIndex=0;

const getFavs=()=>JSON.parse(localStorage.getItem('nubaraPlayFavoritos')||'[]');
const getHist=()=>JSON.parse(localStorage.getItem('nubaraPlayHistorial')||'[]');

// Clock
function tickClock(){const d=new Date();let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;$('clock').textContent=h+':'+m+' '+ap}
setInterval(tickClock,1000);tickClock();

// Data
db.collection('canales').onSnapshot(snap=>{
  channels=[];
  snap.forEach(doc=>{const c=doc.data();if(c.categoria==='Peliculas')return;channels.push({id:doc.id,...c})});
  renderCategories();renderChannels();
},err=>console.error('Error:',err));

db.collection('agenda').onSnapshot(snap=>{
  events=[];snap.forEach(doc=>events.push({id:doc.id,...doc.data()}));
},err=>console.error('Error:',err));

// Categories
function renderCategories(){
  const cats=['Todos',...[...new Set(channels.map(c=>c.categoria).filter(Boolean))].sort()];
  const box=$('categories');box.innerHTML='';
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-chip'+(cat===currentCat?' active':'');
    btn.textContent=cat;
    btn.onclick=()=>{currentCat=cat;renderCategories();renderChannels()};
    box.appendChild(btn);
  });
}

// Channels
function getFilteredChannels(){
  let list=currentView==='destacados'?channels.filter(c=>getFavs().includes(c.id)):
           currentView==='historial'?getHist().map(x=>channels.find(c=>c.id===x.id)).filter(Boolean):
           channels.filter(c=>currentCat==='Todos'||c.categoria===currentCat);
  if(searchQuery)list=list.filter(c=>(c.nombre||'').toLowerCase().includes(searchQuery));
  return list;
}

function renderChannels(){
  const list=getFilteredChannels();
  $('channelCount').textContent=list.length;
  const box=$('channelList');box.innerHTML='';
  
  if(!list.length){box.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">No hay canales</div>';return}
  
  list.forEach((ch,i)=>{
    const item=document.createElement('div');
    item.className='channel-item'+(ch.id===playingId?' playing':'')+(i===focusedIndex?' focused':'');
    item.innerHTML=`
      <div class="channel-logo"><img src="${ch.logo||''}" onerror="this.src='https://via.placeholder.com/120x90/1a1a24/8a8a9a?text=TV'"></div>
      <div class="channel-info">
        <div class="channel-name">${ch.nombre}</div>
        <div class="channel-cat">${ch.categoria||'TV'}</div>
      </div>
    `;
    item.onclick=()=>{focusedIndex=i;playChannel(ch)};
    item.onmouseenter=()=>{focusedIndex=i;updateFocus()};
    box.appendChild(item);
  });
}

function updateFocus(){
  const items=$('channelList').querySelectorAll('.channel-item');
  items.forEach((it,i)=>{
    it.classList.toggle('focused',i===focusedIndex);
    if(i===focusedIndex)it.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}

// Play channel - INSTANT
function playChannel(ch){
  playingId=ch.id;
  $('playerEmpty').style.display='none';
  $('playerTitle').textContent=ch.nombre;
  $('playerCategory').textContent=ch.categoria||'TV';
  $('loadingBar').classList.add('active');
  
  // Instant load
  $('playerFrame').src=ch.url||'';
  
  setTimeout(()=>$('loadingBar').classList.remove('active'),2000);
  
  // History
  let h=getHist().filter(x=>x.id!==ch.id);
  h.unshift({id:ch.id,nombre:ch.nombre,logo:ch.logo,url:ch.url,ts:Date.now()});
  localStorage.setItem('nubaraPlayHistorial',JSON.stringify(h.slice(0,20)));
  
  // Visits
  if(channels.some(c=>c.id===ch.id))
    db.collection('canales').doc(ch.id).update({visitas:(ch.visitas||0)+1}).catch(()=>{});
  
  renderChannels();
}

// Navigation - INSTANT CHANGE
function navigate(dir){
  const list=getFilteredChannels();
  if(!list.length)return;
  focusedIndex=(focusedIndex+dir+list.length)%list.length;
  updateFocus();
  playChannel(list[focusedIndex]); // INSTANT PLAY
}

// Controls
$('btnPrev').onclick=()=>navigate(-1);
$('btnNext').onclick=()=>navigate(1);
$('btnMute').onclick=()=>{muted=!muted;$('btnMute').innerHTML=muted?'🔇 <kbd>M</kbd>':'🔊 <kbd>M</kbd>'};
$('btnZoomIn').onclick=()=>{zoom=Math.min(200,zoom+10);$('playerFrame').style.transform=`scale(${zoom/100})`;$('zoomVal').textContent=zoom+'%'};
$('btnZoomOut').onclick=()=>{zoom=Math.max(50,zoom-10);$('playerFrame').style.transform=`scale(${zoom/100})`;$('zoomVal').textContent=zoom+'%'};
$('btnFullscreen').onclick=()=>{const el=$('playerWrapper');if(!document.fullscreenElement)el.requestFullscreen();else document.exitFullscreen()};
$('btnFav').onclick=()=>{
  if(!playingId)return;
  let f=getFavs();const i=f.indexOf(playingId);
  if(i>-1)f.splice(i,1);else f.push(playingId);
  localStorage.setItem('nubaraPlayFavoritos',JSON.stringify(f));
  $('btnFav').innerHTML=f.includes(playingId)?'★ Favorito <kbd>F</kbd>':'☆ Favorito <kbd>F</kbd>';
};

// Search
$('searchInput').oninput=e=>{searchQuery=e.target.value.toLowerCase();focusedIndex=0;renderChannels()};

// Views
document.querySelectorAll('.nav-item[data-view]').forEach(item=>{
  item.onclick=()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    currentView=item.dataset.view;
    focusedIndex=0;
    renderChannels();
  };
});
$('btnHistorial').onclick=()=>{document.querySelector('[data-view="historial"]').click()};

// KEYBOARD NAVIGATION - INSTANT
document.addEventListener('keydown',e=>{
  if(document.activeElement===$('searchInput')){
    if(e.key==='Escape'){$('searchInput').blur();searchQuery='';$('searchInput').value='';renderChannels()}
    return;
  }

  const list=getFilteredChannels();
  
  switch(e.key){
    case 'ArrowUp':
      e.preventDefault();
      focusedIndex=focusedIndex<=0?list.length-1:focusedIndex-1;
      updateFocus();
      break;
    case 'ArrowDown':
      e.preventDefault();
      focusedIndex=focusedIndex>=list.length-1?0:focusedIndex+1;
      updateFocus();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      navigate(-1); // INSTANT
      break;
    case 'ArrowRight':
      e.preventDefault();
      navigate(1);  // INSTANT
      break;
    case 'Enter':
      e.preventDefault();
      if(focusedIndex>=0&&focusedIndex<list.length)playChannel(list[focusedIndex]);
      break;
    case 'm':case 'M':
      e.preventDefault();$('btnMute').click();break;
    case 'f':case 'F':
      e.preventDefault();$('btnFav').click();break;
    case 'Escape':
      e.preventDefault();
      if(document.fullscreenElement)document.exitFullscreen();
      break;
  }
});

// Init
renderCategories();
renderChannels();
</script>
</body>
</html>
