<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NubaraPlay // Quantum Interface</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05060a;
  --bg-2:#0a0d14;
  --bg-3:#11151f;
  --panel:rgba(17,21,31,0.65);
  --border:rgba(100,220,255,0.12);
  --border-strong:rgba(100,220,255,0.35);
  --text:#e8f4ff;
  --text-dim:#6b7a90;
  --text-mute:#3d4a5c;
  --cyan:#00e5ff;
  --cyan-soft:#00b8d4;
  --magenta:#ff00aa;
  --gold:#ffd700;
  --red:#ff2d55;
  --green:#00ff9d;
  --grad-main:linear-gradient(135deg,#00e5ff 0%,#0066ff 50%,#ff00aa 100%);
  --grad-fire:linear-gradient(135deg,#ff2d55,#ff8800);
  --grad-gold:linear-gradient(135deg,#ffd700,#ff8800);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Rajdhani',sans-serif;
  background:var(--bg);
  color:var(--text);
  position:relative;
}

/* ===== FONDO ANIMADO GRID ===== */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,229,255,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,0.04) 1px,transparent 1px);
  background-size:50px 50px;
  animation:gridMove 20s linear infinite;
  z-index:0;
  pointer-events:none;
}
body::after{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 15% 20%,rgba(0,229,255,0.08),transparent 50%),
    radial-gradient(ellipse at 85% 80%,rgba(255,0,170,0.06),transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(0,102,255,0.04),transparent 70%);
  z-index:0;
  pointer-events:none;
}
@keyframes gridMove{
  from{background-position:0 0}
  to{background-position:50px 50px}
}

/* Scanlines */
.scanlines{
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.15) 0px,rgba(0,0,0,0.15) 1px,transparent 1px,transparent 3px);
  pointer-events:none;
  z-index:9999;
  opacity:0.3;
}

.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== TOPBAR ===== */
.topbar{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;
  background:linear-gradient(180deg,rgba(5,6,10,0.95),rgba(10,13,20,0.85));
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  z-index:10;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:var(--grad-main);
  opacity:0.6;
}
.top-left,.top-right{display:flex;align-items:center;gap:10px}
.top-center{display:flex;align-items:center;gap:16px}

.btn-ghost{
  position:relative;
  padding:7px 16px;
  border:1px solid var(--border);
  border-radius:4px;
  font-size:12px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-dim);
  transition:all .25s;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
  padding-left:22px;padding-right:22px;
}
.btn-ghost:hover{
  color:var(--cyan);
  border-color:var(--cyan);
  background:rgba(0,229,255,0.08);
  box-shadow:0 0 20px rgba(0,229,255,0.3);
}
.btn-ghost::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--cyan);opacity:0;transition:opacity .25s;
}
.btn-ghost:hover::before{opacity:1}

.brand{
  font-family:'Orbitron',sans-serif;
  font-size:20px;font-weight:900;
  letter-spacing:3px;
  color:#fff;
  position:relative;
}
.brand b{
  background:var(--grad-main);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:900;
}
.brand::after{
  content:'v2.7';position:absolute;right:-32px;top:-4px;
  font-size:8px;color:var(--cyan);letter-spacing:2px;
  font-family:'JetBrains Mono',monospace;
}
.user-tag{
  font-family:'Orbitron',sans-serif;
  font-size:11px;font-weight:700;
  letter-spacing:2px;
  padding:4px 12px;
  border:1px solid var(--gold);
  color:var(--gold);
  border-radius:2px;
  text-shadow:0 0 10px rgba(255,215,0,0.5);
}
.status-dot{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--green);
  letter-spacing:1.5px;text-transform:uppercase;
  font-weight:600;
}
.status-dot::before{
  content:'';width:8px;height:8px;
  background:var(--green);border-radius:50%;
  box-shadow:0 0 10px var(--green);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

.icon-btn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
  border-radius:4px;
  font-size:15px;
  transition:all .25s;
  position:relative;
}
.icon-btn:hover{
  border-color:var(--cyan);
  color:var(--cyan);
  box-shadow:0 0 15px rgba(0,229,255,0.4);
  transform:translateY(-2px);
}
.search-wrap{display:flex;align-items:center;gap:8px}
#searchInput{
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  color:var(--cyan);
  padding:7px 14px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  width:180px;
  outline:none;
  border-radius:4px;
  transition:all .25s;
}
#searchInput:focus{
  border-color:var(--cyan);
  width:220px;
  box-shadow:0 0 20px rgba(0,229,255,0.2);
}
#searchInput::placeholder{color:var(--text-mute)}
.wifi{color:var(--cyan);font-size:14px}
.clock{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;
  color:var(--cyan);
  letter-spacing:1px;
  min-width:90px;text-align:right;
  text-shadow:0 0 10px rgba(0,229,255,0.5);
}

/* ===== LAYOUT ===== */
.body-grid{
  display:flex;height:calc(100vh - 57px);
  position:relative;z-index:1;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:88px;
  background:linear-gradient(180deg,rgba(10,13,20,0.9),rgba(5,6,10,0.95));
  border-right:1px solid var(--border);
  padding:14px 0;
  display:flex;flex-direction:column;gap:4px;
  overflow-y:auto;
}
.side-item{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 4px;margin:0 8px;
  border-radius:4px;
  font-size:10px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-dim);
  transition:all .25s;
  position:relative;
  text-decoration:none;
}
.side-item .ico{font-size:20px;filter:grayscale(0.5);transition:all .25s}
.side-item:hover{
  color:var(--text);
  background:rgba(0,229,255,0.05);
}
.side-item:hover .ico{filter:grayscale(0);transform:scale(1.15)}
.side-item.active{
  color:var(--cyan);
  background:linear-gradient(180deg,rgba(0,229,255,0.12),transparent);
  border-left:2px solid var(--cyan);
  margin-left:6px;
}
.side-item.active .ico{filter:grayscale(0);text-shadow:0 0 10px var(--cyan)}
.side-item.danger:hover{color:var(--red);border-left-color:var(--red);background:rgba(255,45,85,0.08)}

/* ===== MAIN ===== */
.main-area{
  flex:1;padding:18px;
  display:flex;flex-direction:column;gap:14px;
  min-width:0;overflow-y:auto;
}

/* ===== PLAYER ===== */
.player-shell{
  position:relative;
  background:#000;
  border-radius:6px;
  overflow:hidden;
  aspect-ratio:16/9;
  max-height:62vh;
  margin:0 auto;width:100%;
  border:1px solid var(--border-strong);
  box-shadow:
    0 0 0 1px rgba(0,229,255,0.1),
    0 20px 60px rgba(0,0,0,0.8),
    0 0 40px rgba(0,229,255,0.15);
}
/* Esquinas decorativas del player */
.player-shell::before,.player-shell::after{
  content:'';position:absolute;width:30px;height:30px;
  border:2px solid var(--cyan);z-index:5;pointer-events:none;
}
.player-shell::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.player-shell::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.corner-tr,.corner-bl{
  position:absolute;width:30px;height:30px;
  border:2px solid var(--cyan);z-index:5;pointer-events:none;
}
.corner-tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
.corner-bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 6px}

.player-zoom{position:absolute;inset:0;transition:transform .3s}
.player-zoom iframe{width:100%;height:100%;border:none}

.player-empty{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:
    radial-gradient(circle at 50% 40%,rgba(0,229,255,0.08),transparent 60%),
    #000;
}
.player-empty .big{
  font-size:60px;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 0 20px var(--cyan));
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.player-empty .sub{
  font-family:'Orbitron',sans-serif;
  font-size:11px;letter-spacing:3px;
  color:var(--text-dim);text-transform:uppercase;
}

.player-title{
  position:absolute;right:16px;bottom:14px;
  display:flex;align-items:center;gap:12px;
  font-family:'Orbitron',sans-serif;
  font-size:15px;font-weight:700;
  color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,0.9),0 0 10px rgba(0,229,255,0.5);
  pointer-events:none;
  letter-spacing:1px;
  z-index:3;
}
.player-title .fs{pointer-events:auto;cursor:pointer;font-size:16px;opacity:.8;transition:all .25s}
.player-title .fs:hover{opacity:1;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.player-shell:fullscreen{width:100vw;height:100vh;border-radius:0;max-height:none}
.player-shell:fullscreen::before,.player-shell:fullscreen::after{display:none}

/* Loading overlay al cambiar canal */
.player-loading{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;justify-content:center;
  flex-direction:column;gap:12px;
  z-index:4;
  backdrop-filter:blur(8px);
}
.player-loading.active{display:flex}
.loader-ring{
  width:60px;height:60px;
  border:3px solid rgba(0,229,255,0.1);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{
  font-family:'Orbitron',sans-serif;
  font-size:11px;letter-spacing:3px;
  color:var(--cyan);
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:.4}}

/* ===== CONTROLS ===== */
.controls{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:10px;
}
.ctrl-btn{
  padding:9px 18px;
  border:1px solid var(--border);
  border-radius:4px;
  font-size:12px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-dim);
  transition:all .25s;
  display:flex;align-items:center;gap:7px;
  background:rgba(0,0,0,0.3);
}
.ctrl-btn:hover{
  color:var(--cyan);border-color:var(--cyan);
  background:rgba(0,229,255,0.08);
  box-shadow:0 0 15px rgba(0,229,255,0.3);
  transform:translateY(-2px);
}
.ctrl-btn.active-fav{
  color:var(--gold);border-color:var(--gold);
  background:rgba(255,215,0,0.1);
  box-shadow:0 0 15px rgba(255,215,0,0.3);
}
.ctrl-btn kbd{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  padding:2px 6px;
  background:rgba(255,255,255,0.08);
  border-radius:3px;
  color:var(--text-dim);
}
.zoom-group{
  display:flex;align-items:center;gap:4px;
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  border-radius:4px;padding:4px;
}
.zoom-group button{
  width:30px;height:30px;
  border-radius:3px;
  font-size:16px;font-weight:700;
  color:var(--text-dim);
  transition:all .25s;
}
.zoom-group button:hover{color:var(--cyan);background:rgba(0,229,255,0.1)}
.zoom-group span{
  min-width:50px;text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;font-weight:700;
  color:var(--cyan);
}

/* ===== CHIPS ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{
  padding:7px 18px;
  border:1px solid var(--border);
  border-radius:4px;
  font-size:11px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-dim);
  transition:all .25s;
  background:rgba(0,0,0,0.3);
}
.chip:hover{color:var(--text);border-color:var(--border-strong);background:rgba(0,229,255,0.05)}
.chip.active{
  background:var(--grad-main);
  color:#fff;border-color:transparent;
  box-shadow:0 0 20px rgba(0,229,255,0.4);
  font-weight:700;
}
.chip-label{
  color:var(--text-mute);font-size:10px;
  letter-spacing:2px;text-transform:uppercase;
  align-self:center;margin-right:4px;font-weight:700;
}

/* ===== CHANNEL LIST ===== */
.channel-list{
  width:320px;
  background:linear-gradient(180deg,rgba(10,13,20,0.9),rgba(5,6,10,0.95));
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
}
.list-header{
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.list-title{
  font-family:'Orbitron',sans-serif;
  font-size:11px;font-weight:700;
  letter-spacing:2px;
  color:var(--cyan);
  text-transform:uppercase;
}
.list-count{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--text-dim);
}
.list-nav{
  padding:10px;font-size:14px;
  color:var(--text-dim);
  transition:all .25s;
  border-top:1px solid var(--border);
}
.list-nav:hover{color:var(--cyan);background:rgba(0,229,255,0.05)}
.list-scroll{
  flex:1;overflow-y:auto;
  padding:8px;
  display:flex;flex-direction:column;gap:6px;
  scrollbar-width:thin;
  scrollbar-color:var(--cyan) transparent;
}
.list-scroll::-webkit-scrollbar{width:5px}
.list-scroll::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px}

.chan-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  border-radius:4px;
  border:1px solid transparent;
  cursor:pointer;
  transition:all .2s;
  position:relative;
  overflow:hidden;
}
.chan-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--cyan);
  transform:scaleY(0);transition:transform .2s;
}
.chan-item:hover{
  background:rgba(0,229,255,0.06);
  border-color:var(--border);
  transform:translateX(3px);
}
.chan-item:hover::before{transform:scaleY(1)}

/* Canal enfocado con teclado */
.chan-item.focused{
  background:rgba(0,229,255,0.12);
  border-color:var(--cyan);
  box-shadow:0 0 20px rgba(0,229,255,0.25),inset 0 0 20px rgba(0,229,255,0.08);
}
.chan-item.focused::before{transform:scaleY(1);background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.chan-item.focused .chan-name{color:#fff;font-weight:700}

/* Canal activo reproduciéndose */
.chan-item.active{
  background:linear-gradient(90deg,rgba(255,0,170,0.15),transparent);
  border-color:var(--magenta);
}
.chan-item.active::before{transform:scaleY(1);background:var(--magenta);box-shadow:0 0 10px var(--magenta)}
.chan-item.active .chan-name{color:#fff;font-weight:700}
.chan-item.active::after{
  content:'▶';position:absolute;right:12px;
  color:var(--magenta);font-size:10px;
  text-shadow:0 0 8px var(--magenta);
  animation:pulse 1.5s infinite;
}

.chan-logo{
  width:56px;height:42px;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--border);
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
  position:relative;z-index:1;
}
.chan-logo img{max-width:90%;max-height:88%;object-fit:contain}
.chan-info{flex:1;min-width:0;position:relative;z-index:1}
.chan-name{
  font-size:13px;font-weight:600;
  color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:0.3px;
}
.chan-cat{
  font-size:9px;font-weight:600;
  color:var(--text-mute);
  letter-spacing:1.5px;text-transform:uppercase;
  margin-top:2px;
}
.list-empty{color:var(--text-mute);text-align:center;padding:40px 10px;font-size:12px;letter-spacing:1px}

/* ===== AGENDA ===== */
#viewAgenda h2{
  font-family:'Orbitron',sans-serif;
  font-size:18px;font-weight:700;
  letter-spacing:2px;
  margin-bottom:18px;
  color:var(--cyan);
  text-transform:uppercase;
}
.agenda-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.agenda-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:18px;
  cursor:pointer;
  transition:all .3s;
  position:relative;
  backdrop-filter:blur(10px);
  overflow:hidden;
}
.agenda-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad-main);
  transform:scaleX(0);transform-origin:left;
  transition:transform .3s;
}
.agenda-card:hover{
  border-color:var(--cyan);
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(0,229,255,0.2);
}
.agenda-card:hover::before{transform:scaleX(1)}
.agenda-card.en-vivo{border-color:var(--red);box-shadow:0 0 25px rgba(255,45,85,0.2)}
.agenda-time{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;
  color:var(--cyan);
  margin-bottom:8px;
  letter-spacing:1px;
}
.agenda-match{
  font-family:'Orbitron',sans-serif;
  font-size:15px;font-weight:700;
  margin-bottom:6px;color:#fff;
  letter-spacing:0.5px;
}
.agenda-channel{font-size:11px;color:var(--text-dim);letter-spacing:1px}
.agenda-badge{
  position:absolute;top:10px;right:10px;
  padding:3px 10px;border-radius:3px;
  font-family:'Orbitron',sans-serif;
  font-size:9px;font-weight:700;
  letter-spacing:1.5px;
}
.badge-en-vivo{background:var(--red);color:#fff;box-shadow:0 0 12px var(--red);animation:pulse 1.5s infinite}
.badge-proximo{background:var(--cyan);color:#000;box-shadow:0 0 12px var(--cyan)}

/* ===== KEYBOARD HINTS ===== */
.kbd-hints{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:14px;
  padding:8px 18px;
  background:rgba(5,6,10,0.9);
  border:1px solid var(--border);
  border-radius:6px;
  backdrop-filter:blur(10px);
  z-index:100;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--text-dim);
  letter-spacing:1px;
}
.kbd-hints span{display:flex;align-items:center;gap:5px}
.kbd-hints kbd{
  padding:2px 6px;
  background:rgba(0,229,255,0.1);
  border:1px solid var(--border-strong);
  border-radius:3px;
  color:var(--cyan);
  font-size:9px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  body{overflow:auto;height:auto}
  .body-grid{flex-direction:column;height:auto}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--border)}
  .side-item{flex:0 0 auto;margin:0;padding:10px 14px}
  .side-item.active{border-left:none;border-bottom:2px solid var(--cyan);margin-left:0;margin-bottom:0}
  .channel-list{width:100%;border-left:none;border-top:1px solid var(--border)}
  .list-scroll{flex-direction:row;overflow-x:auto;padding:10px}
  .chan-item{flex:0 0 220px}
  .player-shell{max-height:none}
  #searchInput{width:120px}
  #searchInput:focus{width:150px}
  .kbd-hints{display:none}
}
</style>
</head>
<body>
<div class="scanlines"></div>

<header class="topbar">
  <div class="top-left">
    <button class="btn-ghost" id="btnVolver">← Volver</button>
    <button class="btn-ghost" id="btnTopHistorial">🕐 Historial</button>
  </div>
  <div class="top-center">
    <span class="brand">NUBARA<b>PLAY</b></span>
    <span class="user-tag" id="userInfo">USUARIO</span>
    <span class="status-dot">Catálogo actualizado</span>
  </div>
  <div class="top-right">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar canal..." class="hidden">
      <button class="icon-btn" id="btnSearch" title="Buscar (S)">🔍</button>
    </div>
    <button class="icon-btn" id="btnUser" title="Usuario">👤</button>
    <span class="wifi">📶</span>
    <span class="clock" id="clock">--:--</span>
  </div>
</header>

<div class="body-grid">
  <aside class="sidebar">
    <button class="side-item active" data-view="tv"><span class="ico">📺</span>TV</button>
    <button class="side-item" data-view="destacados"><span class="ico">👍</span>Destacados</button>
    <button class="side-item" data-view="agenda"><span class="ico">⚽</span>Agenda</button>
    <a class="side-item" href="genero.html"><span class="ico">🎬</span>Películas</a>
    <button class="side-item" data-view="historial"><span class="ico">🕐</span>Historial</button>
    <button class="side-item danger" id="btnSalir" style="margin-top:auto"><span class="ico">⏻</span>Salir</button>
  </aside>

  <main class="main-area">
    <section id="viewPlayer" style="display:flex;flex-direction:column;gap:14px">
      <div class="player-shell" id="playerShell">
        <div class="corner-tr"></div><div class="corner-bl"></div>
        <div class="player-zoom" id="playerZoom"><iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>
        <div class="player-loading" id="playerLoading">
          <div class="loader-ring"></div>
          <div class="loader-text">CARGANDO SEÑAL...</div>
        </div>
        <div class="player-empty" id="playerEmpty">
          <span class="big">📡</span>
          <span class="sub">Selecciona un canal · Usa ↑↓ para navegar · Enter para reproducir</span>
        </div>
        <div class="player-title"><span id="playerTitleText"></span><span class="fs" id="btnFsInline" title="Pantalla completa">⛶</span></div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btnPrev">⏮ Anterior <kbd>←</kbd></button>
        <button class="ctrl-btn" id="btnNext">⏭ Siguiente <kbd>→</kbd></button>
        <button class="ctrl-btn" id="btnMute">🔊 <kbd>M</kbd></button>
        <div class="zoom-group"><button id="btnZoomOut">−</button><span id="zoomVal">100%</span><button id="btnZoomIn">+</button></div>
        <button class="ctrl-btn" id="btnFav">☆ Favorito <kbd>F</kbd></button>
        <button class="ctrl-btn" id="btnFullscreen">⛶ Pantalla completa</button>
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <section id="viewAgenda" class="hidden">
      <h2>📅 Agenda Deportiva</h2>
      <div class="agenda-grid" id="agendaContainer"><div class="list-empty">Cargando agenda...</div></div>
    </section>
  </main>

  <aside class="channel-list" id="channelList">
    <div class="list-header">
      <span class="list-title">📡 Canales</span>
      <span class="list-count" id="listCount">0</span>
    </div>
    <button class="list-nav" id="btnScrollUp">▲</button>
    <div class="list-scroll" id="listScroll"></div>
    <button class="list-nav" id="btnScrollDown">▼</button>
  </aside>
</div>

<div class="kbd-hints">
  <span><kbd>↑</kbd><kbd>↓</kbd> Navegar</span>
  <span><kbd>Enter</kbd> Reproducir</span>
  <span><kbd>←</kbd><kbd>→</kbd> Cambiar</span>
  <span><kbd>M</kbd> Mute</span>
  <span><kbd>F</kbd> Favorito</span>
  <span><kbd>S</kbd> Buscar</span>
  <span><kbd>Esc</kbd> Cerrar</span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);

// ---- Autenticación ----
const savedUser=localStorage.getItem('nubaraPlayUser');
if(!savedUser){window.location.href='index.html'}
else{$('userInfo').textContent=JSON.parse(savedUser).tipo==='demo'?'DEMO':'PREMIUM'}
$('btnSalir').onclick=()=>{localStorage.removeItem('nubaraPlayUser');localStorage.removeItem('nubaraPlayUserExpiry');location.href='index.html'};
$('btnVolver').onclick=()=>history.back();

// ---- Firebase ----
const firebaseConfig={apiKey:"AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",authDomain:"nubaraplay.firebaseapp.com",projectId:"nubaraplay",storageBucket:"nubaraplay.firebasestorage.app",messagingSenderId:"873822057409",appId:"1:873822057409:web:f854a974f457eedd0c7540"};
try{firebase.initializeApp(firebaseConfig)}catch(e){}
const db=firebase.firestore();

// ---- Estado ----
let canales=[],agendaEvents=[];
let currentView='tv',currentCat='Todos',searchQuery='';
let zoom=100,muted=false,playingId=null;
let focusedIndex=-1; // Índice del canal enfocado con teclado

const getFavs=()=>JSON.parse(localStorage.getItem('nubaraPlayFavoritos')||'[]');
const getHist=()=>JSON.parse(localStorage.getItem('nubaraPlayHistorial')||'[]');

// ---- Reloj ----
function tickClock(){const d=new Date();let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;$('clock').textContent=h+':'+m+' '+ap}
setInterval(tickClock,1000);tickClock();

// ---- Datos en tiempo real ----
db.collection('canales').onSnapshot(snap=>{
  canales=[];
  snap.forEach(doc=>{const c=doc.data();if(c.categoria==='Peliculas')return;canales.push({id:doc.id,...c})});
  renderChips();renderList();
},err=>console.error('Error canales:',err));

db.collection('agenda').onSnapshot(snap=>{
  agendaEvents=[];snap.forEach(doc=>agendaEvents.push({id:doc.id,...doc.data()}));
  renderAgenda();
},err=>console.error('Error agenda:',err));

// ---- Chips ----
function renderChips(){
  const cats=['Todos',...[...new Set(canales.map(c=>c.categoria).filter(Boolean))].sort()];
  const box=$('chips');box.innerHTML='';
  const lbl=document.createElement('span');lbl.className='chip-label';lbl.textContent='Categorías:';box.appendChild(lbl);
  cats.forEach(cat=>{
    const b=document.createElement('button');
    b.className='chip'+(cat===currentCat?' active':'');
    b.textContent=cat;
    b.onclick=()=>{currentCat=cat;if(currentView!=='tv')setView('tv');renderChips();renderList()};
    box.appendChild(b);
  });
}

// ---- Lista ----
function getList(){
  let list;
  if(currentView==='destacados')list=canales.filter(c=>getFavs().includes(c.id));
  else if(currentView==='historial'){const h=getHist();list=h.map(x=>canales.find(c=>c.id===x.id)).filter(Boolean)}
  else list=canales.filter(c=>currentCat==='Todos'||c.categoria===currentCat);
  if(searchQuery)list=list.filter(c=>(c.nombre||'').toLowerCase().includes(searchQuery));
  return list;
}

function renderList(){
  const box=$('listScroll');box.innerHTML='';
  const list=getList();
  $('listCount').textContent=list.length;
  if(!list.length){box.innerHTML='<div class="list-empty">No hay canales para mostrar</div>';focusedIndex=-1;return}
  list.forEach((c,i)=>{
    const item=document.createElement('div');
    item.className='chan-item'+(c.id===playingId?' active':'');
    item.dataset.index=i;
    const logo=document.createElement('div');logo.className='chan-logo';
    const img=document.createElement('img');img.loading='lazy';img.src=c.logo||'';
    img.onerror=()=>{img.src='https://via.placeholder.com/120x90/1d1d22/808080?text=TV'};
    logo.appendChild(img);
    const info=document.createElement('div');info.className='chan-info';
    const name=document.createElement('span');name.className='chan-name';name.textContent=c.nombre;
    const cat=document.createElement('div');cat.className='chan-cat';cat.textContent=c.categoria||'TV';
    info.appendChild(name);info.appendChild(cat);
    item.appendChild(logo);item.appendChild(info);
    item.onclick=()=>{focusedIndex=i;play(c)};
    item.onmouseenter=()=>{focusedIndex=i;updateFocus()};
    box.appendChild(item);
  });
  // Restaurar foco si existe
  if(focusedIndex>=0&&focusedIndex<list.length)updateFocus();
}

// ---- FOCO VISUAL (teclado) ----
function updateFocus(){
  const items=$('listScroll').querySelectorAll('.chan-item');
  items.forEach((it,i)=>{
    it.classList.toggle('focused',i===focusedIndex);
  });
  // Scroll automático al elemento enfocado
  if(focusedIndex>=0){
    const target=items[focusedIndex];
    if(target){
      target.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  }
}

// ---- Reproducir (INSTANTÁNEO) ----
function play(canal){
  playingId=canal.id;
  // Mostrar loading
  $('playerLoading').classList.add('active');
  $('playerTitleText').textContent=canal.nombre||'';
  $('playerEmpty').classList.add('hidden');
  $('viewPlayer').classList.remove('hidden');
  $('viewAgenda').classList.add('hidden');
  $('channelList').classList.remove('hidden');

  // Cargar en iframe
  $('playerFrame').src=canal.url||'';
  
  // Ocultar loading cuando cargue
  const iframe=$('playerFrame');
  const hideLoading=()=>{$('playerLoading').classList.remove('active')};
  iframe.onload=hideLoading;
  setTimeout(hideLoading,2500); // Fallback por si onload no dispara

  // Historial
  let h=getHist().filter(x=>x.id!==canal.id);
  h.unshift({id:canal.id,nombre:canal.nombre,logo:canal.logo,url:canal.url,ts:Date.now()});
  localStorage.setItem('nubaraPlayHistorial',JSON.stringify(h.slice(0,20)));

  // Visitas
  if(canales.some(c=>c.id===canal.id))
    db.collection('canales').doc(canal.id).update({visitas:(canal.visitas||0)+1}).catch(()=>{});

  updateFavBtn();renderList();
  const act=$('listScroll').querySelector('.chan-item.active');
  if(act)act.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function navigate(delta){
  const list=getList();if(!list.length)return;
  focusedIndex=(focusedIndex+delta+list.length)%list.length;
  updateFocus();
  play(list[focusedIndex]); // Reproducción INSTANTÁNEA al cambiar
}

// ---- Controles ----
$('btnPrev').onclick=()=>navigate(-1);
$('btnNext').onclick=()=>navigate(1);
$('btnMute').onclick=()=>{muted=!muted;$('btnMute').textContent=muted?'🔇':'🔊'};
function setZoom(v){zoom=Math.max(50,Math.min(200,v));$('playerZoom').style.transform='scale('+zoom/100+')';$('zoomVal').textContent=zoom+'%'}
$('btnZoomIn').onclick=()=>setZoom(zoom+10);
$('btnZoomOut').onclick=()=>setZoom(zoom-10);
$('btnFullscreen').onclick=$('btnFsInline').onclick=()=>{const el=$('playerShell');if(!document.fullscreenElement)el.requestFullscreen().catch(()=>{});else document.exitFullscreen()};
function updateFavBtn(){const isFav=playingId&&getFavs().includes(playingId);$('btnFav').textContent=isFav?'★ Favorito':'☆ Favorito';$('btnFav').classList.toggle('active-fav',!!isFav)}
$('btnFav').onclick=()=>{if(!playingId)return;let f=getFavs();const i=f.indexOf(playingId);if(i>-1)f.splice(i,1);else f.push(playingId);localStorage.setItem('nubaraPlayFavoritos',JSON.stringify(f));updateFavBtn();renderList()};

// ---- Búsqueda ----
$('btnSearch').onclick=()=>{$('searchInput').classList.toggle('hidden');$('searchInput').focus()};
$('searchInput').oninput=e=>{searchQuery=e.target.value.toLowerCase();renderList()};

// ---- Vistas ----
function setView(v){
  currentView=v;
  document.querySelectorAll('.side-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  $('viewPlayer').classList.toggle('hidden',v==='agenda');
  $('viewAgenda').classList.toggle('hidden',v!=='agenda');
  $('channelList').classList.toggle('hidden',v==='agenda');
  renderList();
}
document.querySelectorAll('.side-item[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('btnTopHistorial').onclick=()=>setView('historial');

// ---- Scroll lista ----
$('btnScrollUp').onclick=()=>$('listScroll').scrollBy({top:-240,behavior:'smooth'});
$('btnScrollDown').onclick=()=>$('listScroll').scrollBy({top:240,behavior:'smooth'});

// ==========================================================
// ==== NAVEGACIÓN COMPLETA POR TECLADO ====
// ==========================================================
document.addEventListener('keydown',(e)=>{
  // Ignorar si está escribiendo en el buscador
  if(document.activeElement===$('searchInput')){
    if(e.key==='Escape'){$('searchInput').classList.add('hidden');$('searchInput').value='';searchQuery='';renderList()}
    return;
  }

  const list=getList();

  switch(e.key){
    case 'ArrowUp':
      e.preventDefault();
      if(list.length>0){
        focusedIndex=focusedIndex<=0?list.length-1:focusedIndex-1;
        updateFocus();
      }
      break;
    case 'ArrowDown':
      e.preventDefault();
      if(list.length>0){
        focusedIndex=focusedIndex>=list.length-1?0:focusedIndex+1;
        updateFocus();
      }
      break;
    case 'ArrowLeft':
      e.preventDefault();
      navigate(-1); // Cambia y reproduce al instante
      break;
    case 'ArrowRight':
      e.preventDefault();
      navigate(1);  // Cambia y reproduce al instante
      break;
    case 'Enter':
      e.preventDefault();
      if(focusedIndex>=0&&focusedIndex<list.length){
        play(list[focusedIndex]);
      }
      break;
    case 'm':case 'M':
      e.preventDefault();
      $('btnMute').click();
      break;
    case 'f':case 'F':
      e.preventDefault();
      $('btnFav').click();
      break;
    case 's':case 'S':
      e.preventDefault();
      $('searchInput').classList.remove('hidden');
      $('searchInput').focus();
      break;
    case 'Escape':
      e.preventDefault();
      if(document.fullscreenElement)document.exitFullscreen();
      $('searchInput').classList.add('hidden');
      $('searchInput').value='';searchQuery='';renderList();
      break;
    case ' ':
      e.preventDefault();
      // Espacio = play/pause (toggle iframe src)
      if(playingId){
        const current=$('playerFrame').src;
        if(current){$('playerFrame').src=''}
        else{const c=list.find(x=>x.id===playingId);if(c)$('playerFrame').src=c.url}
      }
      break;
  }
});

// ---- Agenda ----
function eventoYaTermino(ev){if(!ev.horaFin||(ev.dia||'').toUpperCase()!=='HOY')return false;const d=new Date();const now=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return now>ev.horaFin}
function getEstadoEvento(ev){if((ev.dia||'').toUpperCase()!=='HOY')return{texto:'Próximo',clase:'badge-proximo'};const d=new Date();const now=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');if(now<ev.horaInicio)return{texto:'Próximo',clase:'badge-proximo'};if(now>=ev.horaInicio&&now<=ev.horaFin)return{texto:'🔴 EN VIVO',clase:'badge-en-vivo'};return null}
function renderAgenda(){
  const box=$('agendaContainer');
  const eventos=agendaEvents.filter(ev=>!eventoYaTermino(ev));
  if(!eventos.length){box.innerHTML='<div class="list-empty">No hay eventos activos</div>';return}
  const orden={'HOY':0,'MAÑANA':1,'LUNES':2,'MARTES':3,'MIÉRCOLES':4,'JUEVES':5,'VIERNES':6,'SÁBADO':7,'DOMINGO':8};
  eventos.sort((a,b)=>(orden[(a.dia||'').toUpperCase()]??99)-(orden[(b.dia||'').toUpperCase()]??99)||(a.horaInicio||'').localeCompare(b.horaInicio||''));
  box.innerHTML='';
  eventos.forEach(ev=>{
    const estado=getEstadoEvento(ev);
    const card=document.createElement('div');
    card.className='agenda-card'+(estado&&estado.clase==='badge-en-vivo'?' en-vivo':'');
    if(estado&&estado.clase){const badge=document.createElement('div');badge.className='agenda-badge '+estado.clase;badge.textContent=estado.texto;card.appendChild(badge)}
    const t=document.createElement('div');t.className='agenda-time';t.textContent='🕒 '+(ev.dia||'')+' - '+(ev.horaInicio||'')+' a '+(ev.horaFin||'');
    const m=document.createElement('div');m.className='agenda-match';m.textContent=ev.nombre||'';
    const c=document.createElement('div');c.className='agenda-channel';c.textContent='📡 '+(ev.canal||'');
    card.append(t,m,c);
    card.onclick=()=>{setView('tv');play({id:'agenda-'+ev.id,nombre:ev.nombre,url:ev.url})};
    box.appendChild(card);
  });
}
setInterval(renderAgenda,30000);
</script>
</body>
</html>
