<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canales en Vivo - NubaraPlay</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0c;--panel:#0d0d10;--panel2:#16161a;--border:#232329;--text:#e4e4e7;--muted:#8b8b93;--orange:#f97316;--red1:#d12b3a;--red2:#8f1222}
body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}
button{font-family:inherit}

/* ===== TOPBAR ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-center{display:flex;align-items:center;gap:14px}
.ghost-btn{background:var(--panel2);border:1px solid var(--border);color:#d4d4d8;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;transition:.2s}
.ghost-btn:hover{border-color:var(--orange);color:#fff}
.brand{font-size:17px;font-weight:800;letter-spacing:.5px;color:#fff}
.brand b{color:var(--orange)}
.user-tag{color:var(--orange);font-weight:800;font-size:15px}
.status-dot{color:var(--muted);font-size:12.5px}
.status-dot::before{content:'●';color:#22c55e;margin-right:6px;font-size:10px}
.icon-btn{background:var(--panel2);border:1px solid var(--border);color:#d4d4d8;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:hover{border-color:var(--orange);color:#fff}
#searchInput{background:var(--panel2);border:1px solid var(--border);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;width:190px;outline:none}
#searchInput:focus{border-color:var(--orange)}
.clock{font-weight:700;font-size:15px;color:#fff;min-width:74px;text-align:right}
.sort-wrap{position:relative}
.sort-menu{position:absolute;right:0;top:44px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:6px;display:none;flex-direction:column;gap:2px;z-index:50;min-width:150px}
.sort-menu.open{display:flex}
.sort-menu button{background:none;border:none;color:#d4d4d8;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
.sort-menu button:hover,.sort-menu button.active{background:rgba(249,115,22,.15);color:var(--orange)}

/* ===== LAYOUT ===== */
.body-grid{flex:1;display:flex;min-height:0}

/* ===== SIDEBAR ===== */
.sidebar{width:92px;background:var(--panel);border-right:1px solid var(--border);padding:14px 0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex-shrink:0}
.side-item{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;cursor:pointer;font-size:11px;border-radius:10px;margin:0 8px;text-decoration:none;transition:.2s}
.side-item .ico{font-size:20px;line-height:1}
.side-item:hover{color:#fff;background:var(--panel2)}
.side-item.active{color:var(--orange)}
.side-item.danger:hover{color:#ef4444}

/* ===== MAIN ===== */
.main-area{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow-y:auto;position:relative}
.player-shell{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-height:62vh;margin:0 auto;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.player-zoom{position:absolute;inset:0;transition:transform .2s ease}
.player-zoom iframe{width:100%;height:100%;border:none}
.player-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:16px;background:radial-gradient(circle at 50% 40%,#101018,#000)}
.player-empty .big{font-size:44px}
.player-title{position:absolute;right:14px;bottom:12px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none;z-index:5}
.player-title .fs{pointer-events:auto;cursor:pointer;font-size:16px;opacity:.8}
/* multi-pantalla */
.multi-grid{position:absolute;inset:0;display:grid;gap:4px;background:#000}
.multi-grid.g2{grid-template-columns:1fr 1fr}
.multi-grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.m-cell{position:relative;background:#0a0a0c;border:2px solid transparent;cursor:pointer;overflow:hidden}
.m-cell.active-slot{border-color:var(--orange)}
.m-cell iframe{width:100%;height:100%;border:none;pointer-events:none}
.m-cell .m-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4b4b52;font-size:13px}
.m-cell .m-name{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}
.m-cell .m-close{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.6);border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;display:none}
.m-cell:hover .m-close{display:block}
.player-shell:fullscreen{width:100vw;height:100vh;border-radius:0;max-height:none}

/* ===== CONTROLES ===== */
.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
.ctrl-btn{background:var(--panel2);border:1px solid var(--border);color:#d4d4d8;padding:9px 16px;border-radius:10px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:7px;transition:.2s}
.ctrl-btn:hover{border-color:var(--orange);color:#fff}
.ctrl-btn.active-fav{color:#ffd700;border-color:#ffd700}
.ctrl-btn.active-multi{color:var(--orange);border-color:var(--orange)}
.zoom-group{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:4px}
.zoom-group button{background:transparent;border:none;color:#d4d4d8;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.zoom-group button:hover{background:#26262c;color:#fff}
.zoom-group span{min-width:46px;text-align:center;font-size:13px;font-weight:700}

/* ===== CHIPS ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.chip:hover{color:#fff;border-color:var(--orange)}
.chip.active{background:var(--orange);color:#141414;border-color:var(--orange)}
.chip-label{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;align-self:center;margin-right:4px}

/* ===== LISTA DERECHA (OCULTABLE) ===== */
.channel-list{width:300px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s ease,opacity .25s;overflow:hidden}
.channel-list.collapsed{width:0;border-left:none;opacity:0}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0}
.list-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.list-toggle{background:var(--panel2);border:1px solid var(--border);color:#d4d4d8;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:12px}
.list-toggle:hover{border-color:var(--orange);color:#fff}
#btnShowList{position:absolute;right:16px;top:16px;z-index:20;background:var(--panel2);border:1px solid var(--border);color:#d4d4d8;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:15px;display:none}
#btnShowList:hover{border-color:var(--orange);color:#fff}
.list-nav{background:transparent;border:none;color:var(--muted);padding:8px;cursor:pointer;font-size:13px}
.list-nav:hover{color:var(--orange)}
.list-scroll{flex:1;overflow-y:auto;padding:0 10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#2c2c33 transparent}
.list-scroll::-webkit-scrollbar{width:6px}.list-scroll::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:3px}
.chan-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;cursor:pointer;transition:.2s;border:1px solid transparent;flex-shrink:0}
.chan-item:hover{background:var(--panel2)}
.chan-item.active{background:linear-gradient(100deg,var(--red1),var(--red2));box-shadow:0 6px 18px rgba(209,43,58,.35)}
.chan-item.active .chan-name{color:#fff;font-weight:700}
.chan-item.active::before{content:'▶';color:#fff;font-size:13px;margin-right:-4px}
.chan-logo{width:58px;height:46px;background:#1d1d22;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.chan-logo img{max-width:90%;max-height:88%;object-fit:contain}
.chan-name{font-size:14.5px;color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}

/* ===== AGENDA ===== */
.agenda-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.agenda-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.25s;position:relative}
.agenda-card:hover{border-color:var(--orange);transform:translateY(-3px)}
.agenda-card.en-vivo{border-color:var(--red1)}
.agenda-time{color:var(--orange);font-size:12.5px;font-weight:700;margin-bottom:8px}
.agenda-match{font-size:17px;font-weight:700;margin-bottom:6px;color:#fff}
.agenda-channel{font-size:12.5px;color:var(--muted)}
.agenda-badge{position:absolute;top:10px;right:10px;padding:3px 10px;border-radius:10px;font-size:10.5px;font-weight:800}
.badge-en-vivo{background:var(--red1);color:#fff;animation:pulse 1.5s infinite}
.badge-proximo{background:#17a2b8;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
body{overflow:auto;height:auto}
.body-grid{flex-direction:column}
.sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:6px}
.side-item{flex:0 0 auto;margin:0}
.channel-list{width:100%;border-left:none;border-top:1px solid var(--border)}
.channel-list.collapsed{height:0;width:100%}
.list-scroll{flex-direction:row;overflow-x:auto;padding:10px}
.chan-item{flex:0 0 220px}
.player-shell{max-height:none}
#searchInput{width:120px}
}
</style>
</head>
<body>
<!-- ================= TOPBAR ================= -->
<header class="topbar">
<div class="topbar-left">
<button class="ghost-btn" id="btnVolver">← Volver</button>
<button class="ghost-btn" id="btnTopHistorial">🕐 Historial</button>
</div>
<div class="topbar-center">
<span class="brand">NUBARA<b>PLAY</b></span>
<span class="user-tag" id="userInfo">USUARIO</span>
<span class="status-dot" id="statusCat">Catálogo actualizado</span>
</div>
<div class="topbar-right">
<input type="text" id="searchInput" placeholder="Buscar canal..." class="hidden">
<button class="icon-btn" id="btnSearch">🔍</button>
<div class="sort-wrap">
<button class="icon-btn" id="btnSort">⏳</button>
<div class="sort-menu" id="sortMenu">
<button data-sort="nombre" class="active">A → Z</button>
<button data-sort="nombreDesc">Z → A</button>
<button data-sort="visitas">Más vistos</button>
</div>
</div>
<button class="icon-btn" id="btnUser">👤</button>
<span>📶</span>
<span class="clock" id="clock">--:--</span>
</div>
</header>

<div class="body-grid">
<!-- ================= SIDEBAR ================= -->
<aside class="sidebar">
<button class="side-item active" data-view="tv"><span class="ico">📺</span>TV</button>
<button class="side-item" data-view="destacados"><span class="ico">👍</span>Destacados</button>
<button class="side-item" data-view="agenda"><span class="ico">⚽</span>Agenda</button>
<a class="side-item" href="genero.html"><span class="ico">🎬</span>Películas</a>
<button class="side-item" data-view="historial"><span class="ico">🕐</span>Historial</button>
<button class="side-item danger" id="btnSalir" style="margin-top:auto"><span class="ico">⏻</span>Salir</button>
</aside>

<!-- ================= MAIN ================= -->
<main class="main-area">
<button id="btnShowList" title="Mostrar canales">▶</button>

<!-- Vista Reproductor -->
<section id="viewPlayer" style="display:flex;flex-direction:column;gap:14px;">
<div class="player-shell" id="playerShell">
<div class="player-zoom" id="playerZoom"><iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>
<div class="multi-grid g2 hidden" id="multiGrid"></div>
<div class="player-empty" id="playerEmpty"><span class="big">📡</span>Selecciona un canal de la lista para reproducir</div>
<div class="player-title"><span id="playerTitleText"></span><span class="fs" id="btnFsInline" title="Pantalla completa">⛶</span></div>
</div>
<div class="controls">
<button class="ctrl-btn" id="btnPrev">⏮ Anterior</button>
<button class="ctrl-btn" id="btnNext">⏭ Siguiente</button>
<button class="ctrl-btn" id="btnMute">🔊</button>
<div class="zoom-group"><button id="btnZoomOut">−</button><span id="zoomVal">100%</span><button id="btnZoomIn">+</button></div>
<button class="ctrl-btn" id="btnFav">☆ Favorito</button>
<button class="ctrl-btn" id="btnMulti">🔲 Multi</button>
<button class="ctrl-btn" id="btnFullscreen">⛶ Pantalla completa</button>
</div>
<div class="chips" id="chips"></div>
</section>

<!-- Vista Agenda -->
<section id="viewAgenda" class="hidden">
<h2 style="font-size:20px;margin-bottom:16px">📅 Agenda Deportiva</h2>
<div class="agenda-grid" id="agendaContainer"><div class="list-empty">Cargando agenda...</div></div>
</section>
</main>

<!-- ================= LISTA DERECHA ================= -->
<aside class="channel-list" id="channelList">
<div class="list-head">
<span class="list-title" id="listTitle">Canales</span>
<button class="list-toggle" id="btnHideList" title="Ocultar lista">◀</button>
</div>
<button class="list-nav" id="btnScrollUp">▲</button>
<div class="list-scroll" id="listScroll"></div>
<button class="list-nav" id="btnScrollDown">▼</button>
</aside>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);

/* ---- Auth ---- */
const savedUser=localStorage.getItem('nubaraPlayUser');
if(!savedUser){window.location.href='index.html'}
else{$('userInfo').textContent=JSON.parse(savedUser).tipo==='demo'?'DEMO':'PREMIUM'}
$('btnSalir').onclick=()=>{localStorage.removeItem('nubaraPlayUser');localStorage.removeItem('nubaraPlayUserExpiry');location.href='index.html'};
$('btnVolver').onclick=()=>history.back();

/* ---- Firebase ---- */
const firebaseConfig={apiKey:"AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",authDomain:"nubaraplay.firebaseapp.com",projectId:"nubaraplay",storageBucket:"nubaraplay.firebasestorage.app",messagingSenderId:"873822057409",appId:"1:873822057409:web:f854a974f457eedd0c7540"};
try{firebase.initializeApp(firebaseConfig)}catch(e){}
const db=firebase.firestore();

/* ---- Estado ---- */
let canales=[],agendaEvents=[];
let currentView='tv',currentCat='Todos',searchQuery='',sortBy='nombre';
let zoom=100,muted=false,playingId=null;
let multiMode=1,slots=[],activeSlot=0; // multi: 1|2|4

const getFavs=()=>JSON.parse(localStorage.getItem('nubaraPlayFavoritos')||'[]');
const getHist=()=>JSON.parse(localStorage.getItem('nubaraPlayHistorial')||'[]');

/* ---- Reloj 12h AM/PM ---- */
function tickClock(){const d=new Date();let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;$('clock').textContent=h+':'+m+' '+ap}
setInterval(tickClock,1000);tickClock();

/* ---- Datos en tiempo real ---- */
db.collection('canales').onSnapshot(snap=>{
canales=[];snap.forEach(doc=>{const c=doc.data();if(c.categoria==='Peliculas')return;canales.push({id:doc.id,...c})});
const d=new Date();$('statusCat').textContent='Catálogo actualizado '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
renderChips();renderList();
},err=>console.error('Error canales:',err));

db.collection('agenda').onSnapshot(snap=>{agendaEvents=[];snap.forEach(doc=>agendaEvents.push({id:doc.id,...doc.data()}));renderAgenda()},err=>console.error('Error agenda:',err));

/* ---- Chips categoría ---- */
function renderChips(){
const cats=['Todos',...[...new Set(canales.map(c=>c.categoria).filter(Boolean))].sort()];
const box=$('chips');box.innerHTML='';
const lbl=document.createElement('span');lbl.className='chip-label';lbl.textContent='Categorías:';box.appendChild(lbl);
cats.forEach(cat=>{const b=document.createElement('button');b.className='chip'+(cat===currentCat?' active':'');b.textContent=cat;
b.onclick=()=>{currentCat=cat;if(currentView!=='tv')setView('tv');renderChips();renderList()};box.appendChild(b)});
}

/* ---- Lista según vista/filtros/orden ---- */
function getList(){
let list;
if(currentView==='destacados')list=canales.filter(c=>getFavs().includes(c.id));
else if(currentView==='historial'){const h=getHist();list=h.map(x=>canales.find(c=>c.id===x.id)).filter(Boolean)}
else list=canales.filter(c=>currentCat==='Todos'||c.categoria===currentCat);
if(searchQuery)list=list.filter(c=>(c.nombre||'').toLowerCase().includes(searchQuery));
if(sortBy==='nombre')list.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
if(sortBy==='nombreDesc')list.sort((a,b)=>(b.nombre||'').localeCompare(a.nombre||''));
if(sortBy==='visitas')list.sort((a,b)=>(b.visitas||0)-(a.visitas||0));
return list;
}

function renderList(){
const box=$('listScroll');box.innerHTML='';
$('listTitle').textContent=currentView==='destacados'?'Destacados':currentView==='historial'?'Historial':'Canales';
const list=getList();
if(!list.length){box.innerHTML='<div class="list-empty">No hay canales para mostrar</div>';return}
list.forEach(c=>{
const item=document.createElement('div');
item.className='chan-item'+(multiMode===1&&c.id===playingId?' active':'');
const logo=document.createElement('div');logo.className='chan-logo';
const img=document.createElement('img');img.loading='lazy';img.src=c.logo||'';
img.onerror=()=>{img.src='https://via.placeholder.com/120x90/1d1d22/808080?text=TV'};logo.appendChild(img);
const name=document.createElement('span');name.className='chan-name';name.textContent=c.nombre;
item.appendChild(logo);item.appendChild(name);
item.onclick=()=>{multiMode===1?play(c):assignToSlot(c)};
box.appendChild(item)});
}

/* ---- Reproducir (single) ---- */
function play(canal){
playingId=canal.id;
$('playerFrame').src=canal.url||'';
$('playerTitleText').textContent=canal.nombre||'';
$('playerEmpty').classList.add('hidden');
let h=getHist().filter(x=>x.id!==canal.id);
h.unshift({id:canal.id,nombre:canal.nombre,ts:Date.now()});
localStorage.setItem('nubaraPlayHistorial',JSON.stringify(h.slice(0,20)));
if(canales.some(c=>c.id===canal.id)){
db.collection('canales').doc(canal.id).update({visitas:(canal.visitas||0)+1}).catch(()=>{});
const usuario=JSON.parse(localStorage.getItem('nubaraPlayUser')||'{}');
db.collection('visualizaciones').add({usuarioId:usuario.id||'anonimo',usuarioNombre:usuario.nombre||'Anonimo',tipo:'canal',contenidoId:canal.id,nombre:canal.nombre,categoria:canal.categoria||'General',fecha:new Date()}).catch(()=>{});
}
updateFavBtn();renderList();
const act=$('listScroll').querySelector('.chan-item.active');
if(act)act.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function navigate(delta){
if(multiMode!==1)return;
const list=getList();if(!list.length)return;
let idx=list.findIndex(c=>c.id===playingId);
idx=(idx+delta+list.length)%list.length;
play(list[idx]);
}

/* ---- Multi-pantalla ---- */
function setMulti(n){
multiMode=n;slots=new Array(n).fill(null);activeSlot=0;
$('btnMulti').classList.toggle('active-multi',n>1);
$('btnMulti').innerHTML=n===1?'🔲 Multi':n===2?'🔲 2 pantallas':'🔲 4 pantallas';
if(n===1){$('multiGrid').classList.add('hidden');$('playerZoom').classList.remove('hidden')}
else{
$('playerZoom').classList.add('hidden');$('playerEmpty').classList.add('hidden');
const g=$('multiGrid');g.classList.remove('hidden');g.className='multi-grid '+(n===2?'g2':'g4');
g.innerHTML='';
for(let i=0;i<n;i++){
const cell=document.createElement('div');cell.className='m-cell'+(i===activeSlot?' active-slot':'');cell.dataset.i=i;
cell.innerHTML='<div class="m-empty">Celda '+(i+1)+' — elige un canal</div><span class="m-name"></span><button class="m-close">✕</button>';
cell.querySelector('.m-close').onclick=e=>{e.stopPropagation();clearSlot(i)};
cell.onclick=()=>{activeSlot=i;refreshSlots()};
g.appendChild(cell)}
renderList()}
}
function assignToSlot(c){
let idx=slots.findIndex(s=>!s);if(idx===-1)idx=activeSlot;
slots[idx]={id:c.id,nombre:c.nombre,url:c.url};activeSlot=(idx+1)%multiMode;
refreshSlots();renderList();
}
function clearSlot(i){slots[i]=null;refreshSlots()}
function refreshSlots(){
if(multiMode===1)return;
const cells=$('multiGrid').children;
for(let i=0;i<multiMode;i++){
const cell=cells[i];const s=slots[i];
cell.classList.toggle('active-slot',i===activeSlot);
let f=cell.querySelector('iframe');
if(s){
if(!f){f=document.createElement('iframe');f.allow='autoplay; encrypted-media';f.allowFullscreen=true;cell.prepend(f)}
f.src=s.url;cell.querySelector('.m-name').textContent=s.nombre;
cell.querySelector('.m-empty').style.display='none';
}else{
if(f)f.remove();cell.querySelector('.m-name').textContent='';
cell.querySelector('.m-empty').style.display='flex'}
}
}
$('btnMulti').onclick=()=>{setMulti(multiMode===1?2:multiMode===2?4:1)};

/* ---- Controles ---- */
$('btnPrev').onclick=()=>navigate(-1);
$('btnNext').onclick=()=>navigate(1);
$('btnMute').onclick=()=>{muted=!muted;$('btnMute').textContent=muted?'🔇':'🔊'};
function setZoom(v){zoom=Math.max(50,Math.min(200,v));$('playerZoom').style.transform='scale('+zoom/100+')';$('zoomVal').textContent=zoom+'%'}
$('btnZoomIn').onclick=()=>setZoom(zoom+10);
$('btnZoomOut').onclick=()=>setZoom(zoom-10);
$('btnFullscreen').onclick=$('btnFsInline').onclick=()=>{
const el=$('playerShell');
if(!document.fullscreenElement)el.requestFullscreen().catch(()=>{});else document.exitFullscreen()};
function updateFavBtn(){
const isFav=playingId&&getFavs().includes(playingId);
$('btnFav').textContent=isFav?'★ Favorito':'☆ Favorito';
$('btnFav').classList.toggle('active-fav',!!isFav)}
$('btnFav').onclick=()=>{
if(!playingId)return;
let f=getFavs();const i=f.indexOf(playingId);
if(i>-1)f.splice(i,1);else f.push(playingId);
localStorage.setItem('nubaraPlayFavoritos',JSON.stringify(f));
updateFavBtn();renderList()};

/* ---- Búsqueda + orden ---- */
$('btnSearch').onclick=()=>{$('searchInput').classList.toggle('hidden');$('searchInput').focus()};
$('searchInput').oninput=e=>{searchQuery=e.target.value.toLowerCase();renderList()};
$('btnSort').onclick=e=>{e.stopPropagation();$('sortMenu').classList.toggle('open')};
document.addEventListener('click',()=>$('sortMenu').classList.remove('open'));
$('sortMenu').querySelectorAll('button').forEach(b=>b.onclick=e=>{
e.stopPropagation();sortBy=b.dataset.sort;
$('sortMenu').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');$('sortMenu').classList.remove('open');renderList()});

/* ---- Lista ocultable ---- */
function setListVisible(v){
$('channelList').classList.toggle('collapsed',!v);
$('btnShowList').style.display=v?'none':'flex'}
$('btnHideList').onclick=()=>setListVisible(false);
$('btnShowList').onclick=()=>setListVisible(true);

/* ---- Vistas sidebar ---- */
function setView(v){
currentView=v;
document.querySelectorAll('.side-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
$('viewPlayer').classList.toggle('hidden',v==='agenda');
$('viewAgenda').classList.toggle('hidden',v!=='agenda');
$('channelList').classList.toggle('hidden',v==='agenda');
if(v==='agenda')setListVisible(true);
renderList()}
document.querySelectorAll('.side-item[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('btnTopHistorial').onclick=()=>setView('historial');

/* ---- Scroll lista ---- */
$('btnScrollUp').onclick=()=>$('listScroll').scrollBy({top:-240,behavior:'smooth'});
$('btnScrollDown').onclick=()=>$('listScroll').scrollBy({top:240,behavior:'smooth'});

/* ---- Teclado (mando Xuper) ---- */
document.addEventListener('keydown',e=>{
if(e.target.tagName==='INPUT')return;
const list=getList();
if(e.key==='ArrowDown'||e.key==='ArrowUp'){
if(multiMode!==1||currentView==='agenda')return;
let idx=list.findIndex(c=>c.id===playingId);
idx=e.key==='ArrowDown'?Math.min(idx+1,list.length-1):Math.max(idx-1,0);
if(list[idx])play(list[idx]);e.preventDefault()}
if(e.key==='ArrowRight')navigate(1);
if(e.key==='ArrowLeft')navigate(-1);
if(e.key==='f'||e.key==='F')$('btnFullscreen').click();
if(e.key==='m'||e.key==='M')$('btnMute').click();
});

/* ---- Agenda ---- */
function eventoYaTermino(ev){
if(!ev.horaFin||(ev.dia||'').toUpperCase()!=='HOY')return false;
const d=new Date();const now=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
return now>ev.horaFin}
function getEstadoEvento(ev){
if((ev.dia||'').toUpperCase()!=='HOY')return{text:'Próximo',clase:'badge-proximo'};
const d=new Date();const now=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
if(now<ev.horaInicio)return{text:'Próximo',clase:'badge-proximo'};
if(now>=ev.horaInicio&&now<=ev.horaFin)return{text:'🔴 EN VIVO',clase:'badge-en-vivo'};
return null}
function renderAgenda(){
const box=$('agendaContainer');
const eventos=agendaEvents.filter(ev=>!eventoYaTermino(ev));
if(!eventos.length){box.innerHTML='<div class="list-empty">No hay eventos activos</div>';return}
const orden={'HOY':0,'MAÑANA':1,'LUNES':2,'MARTES':3,'MIÉRCOLES':4,'JUEVES':5,'VIERNES':6,'SÁBADO':7,'DOMINGO':8};
eventos.sort((a,b)=>(orden[(a.dia||'').toUpperCase()]??99)-(orden[(b.dia||'').toUpperCase()]??99)||(a.horaInicio||'').localeCompare(b.horaInicio||''));
box.innerHTML='';
eventos.forEach(ev=>{
const estado=getEstadoEvento(ev);
const card=document.createElement('div');
card.className='agenda-card'+(estado&&estado.clase==='badge-en-vivo'?' en-vivo':'');
if(estado&&estado.clase){const badge=document.createElement('div');badge.className='agenda-badge '+estado.clase;badge.textContent=estado.texto;card.appendChild(badge)}
const t=document.createElement('div');t.className='agenda-time';t.textContent='🕒 '+(ev.dia||'')+' - '+(ev.horaInicio||'')+' a '+(ev.horaFin||'');
const m=document.createElement('div');m.className='agenda-match';m.textContent=ev.nombre||'';
const c=document.createElement('div');c.className='agenda-channel';c.textContent='📡 '+(ev.canal||'');
card.append(t,m,c);
card.onclick=()=>{setView('tv');if(multiMode!==1)setMulti(1);play({id:'agenda-'+ev.id,nombre:ev.nombre,url:ev.url})};
box.appendChild(card)})}
setInterval(renderAgenda,30000);
</script>
</body>
