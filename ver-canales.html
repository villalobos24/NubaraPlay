<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NubaraPlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --negro:#000;
  --panel:#0a0a0a;
  --morado:#a855f7;
  --morado-osc:#3b1a5e;
  --texto:#e5e5e5;
  --gris:#7a7a7a;
}
html,body{height:100%;overflow:hidden;background:var(--negro);color:var(--texto);font-family:'Segoe UI',Arial,sans-serif}

/* LAYOUT EXACTO: lista izquierda | (reproductor arriba + barra info abajo) derecha */
.app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:1fr auto;height:100vh;width:100vw}

/* ===== LISTA DE CANALES (izquierda, ocupa las 2 filas) ===== */
.lista{
  grid-row:1/3;
  background:var(--panel);
  border-right:1px solid #1a1a1a;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.lista-head{padding:14px 18px;font-size:12px;letter-spacing:2px;color:var(--gris);text-transform:uppercase;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between}
.lista-scroll{flex:1;overflow-y:auto;padding:6px 0}
.lista-scroll::-webkit-scrollbar{width:5px}
.lista-scroll::-webkit-scrollbar-thumb{background:#222}

.ch{
  display:flex;align-items:center;gap:10px;
  padding:9px 18px;cursor:pointer;
  font-size:13px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--texto);transition:background .1s;
  border-left:3px solid transparent;
}
.ch .num{color:var(--gris);min-width:26px;font-weight:700}
.ch .sep{color:#333}
.ch .nom{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch:hover{background:#111}
.ch.sel{
  background:var(--morado-osc);
  border-left-color:var(--morado);
  color:#fff;
}
.ch.sel .num{color:var(--morado)}
.ch.playing .nom::after{content:' ▶';color:var(--morado);font-size:10px}

/* ===== REPRODUCTOR (derecha arriba) ===== */
.player{
  position:relative;
  background:#000;
  overflow:hidden;
  min-height:0;
}
.player iframe{width:100%;height:100%;border:none;display:block}
.player .logo-canal{
  position:absolute;top:18px;right:22px;
  background:rgba(0,0,0,.6);border-radius:8px;
  padding:8px 14px;display:flex;align-items:center;gap:8px;
  font-weight:800;font-size:18px;letter-spacing:1px;
  pointer-events:none;
}
.player .logo-canal img{height:34px;max-width:60px;object-fit:contain}
.player .empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:#444;
}
.player .empty span{font-size:40px}

/* ===== BARRA INFERIOR (derecha abajo) ===== */
.info{
  background:var(--panel);
  border-top:1px solid #1a1a1a;
  padding:14px 22px;
  display:flex;align-items:center;gap:22px;
  min-height:96px;
}
.info .logo-box{
  width:70px;height:54px;background:#111;border-radius:6px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  overflow:hidden;
}
.info .logo-box img{max-width:90%;max-height:90%;object-fit:contain}
.info .canal-titulo{
  color:var(--morado);font-size:22px;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;
  display:flex;align-items:baseline;gap:8px;
}
.info .canal-titulo .n{font-size:22px}
.info .epg{flex:1;font-size:13px;color:var(--gris);line-height:1.7}
.info .epg b{color:var(--morado);font-weight:600}
.info .atajos{
  text-align:right;font-size:11px;color:var(--gris);
  letter-spacing:1px;line-height:1.8;flex-shrink:0;
}
.info .atajos .k{color:#999}
.info .atajos kbd{
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:3px;
  padding:1px 5px;color:var(--morado);font-family:monospace;font-size:10px;
}
.info .reloj{color:var(--gris);font-family:monospace;font-size:12px;margin-top:4px}

/* Responsive: si la pantalla es muy chica, apila */
@media(max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .lista{grid-row:auto;max-height:38vh;border-right:none;border-bottom:1px solid #1a1a1a}
  .info{flex-wrap:wrap;min-height:auto}
}
</style>
</head>
<body>
<div class="app">

  <!-- LISTA IZQUIERDA -->
  <aside class="lista">
    <div class="lista-head"><span>Canales</span><span id="count">0</span></div>
    <div class="lista-scroll" id="lista"></div>
  </aside>

  <!-- REPRODUCTOR -->
  <section class="player" id="player">
    <iframe id="frame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    <div class="logo-canal" id="logoCanal" style="display:none"></div>
    <div class="empty" id="empty"><span>📡</span>Selecciona un canal</div>
  </section>

  <!-- BARRA INFERIOR -->
  <footer class="info">
    <div class="logo-box" id="logoBox"></div>
    <div class="canal-titulo" id="titulo">-- | SIN SEÑAL</div>
    <div class="epg">
      <div><b>Ahora:</b> <span id="ahora">No hay información disponible</span></div>
      <div><b>Siguiente:</b> <span id="siguiente">No hay información disponible</span></div>
    </div>
    <div class="atajos">
      <div><span class="kbd">↑</span> <span class="kbd">↓</span> Navegar &nbsp; <span class="k">Enter</span> Reproducir</div>
      <div><span class="k">L</span> Lista &nbsp; <span class="k">F</span> Favorito &nbsp; <span class="k">Esc</span> Ocultar</div>
      <div class="reloj" id="reloj">--:-- | --/--/----</div>
    </div>
  </footer>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);

const savedUser=localStorage.getItem('nubaraPlayUser');
if(!savedUser){window.location.href='index.html'}

const firebaseConfig={apiKey:"AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",authDomain:"nubaraplay.firebaseapp.com",projectId:"nubaraplay",storageBucket:"nubaraplay.firebasestorage.app",messagingSenderId:"873822057409",appId:"1:873822057409:web:f854a974f457eedd0c7540"};
try{firebase.initializeApp(firebaseConfig)}catch(e){}
const db=firebase.firestore();

let canales=[], sel=0, playingId=null;

// Reloj con fecha (como tu TV)
function reloj(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  const mo=String(d.getMonth()+1).padStart(2,'0');
  $('reloj').textContent=`${hh}:${mm} | ${dd}/${mo}/${d.getFullYear()}`;
}
setInterval(reloj,1000);reloj();

// CARGA (sin filtro que rompa nada)
db.collection('canales').onSnapshot(snap=>{
  canales=[];
  snap.forEach(doc=>canales.push({id:doc.id,...doc.data()}));
  // orden por número si existe, si no por nombre
  canales.sort((a,b)=>(a.numero||0)-(b.numero||0)||String(a.nombre).localeCompare(String(b.nombre)));
  render();
},err=>console.error(err));

function render(){
  $('count').textContent=canales.length;
  const box=$('lista');box.innerHTML='';
  canales.forEach((c,i)=>{
    const num=c.numero||(i+1);
    const div=document.createElement('div');
    div.className='ch'+(i===sel?' sel':'')+(c.id===playingId?' playing':'');
    div.innerHTML=`<span class="num">${num}</span><span class="sep">|</span><span class="nom">${c.nombre||'S/N'}</span>`;
    div.onclick=()=>{sel=i;play(c)};
    box.appendChild(div);
  });
  // scroll al seleccionado
  const el=box.children[sel];
  if(el)el.scrollIntoView({block:'nearest'});
}

// REPRODUCCIÓN INSTANTÁNEA
function play(c){
  if(!c)return;
  playingId=c.id;
  $('empty').style.display='none';
  $('frame').src=c.url||'';
  const num=c.numero||(sel+1);
  $('titulo').innerHTML=`<span class="n">${num}</span> | ${c.nombre||'SIN SEÑAL'}`;
  $('logoBox').innerHTML=c.logo?`<img src="${c.logo}">`:'';
  $('logoCanal').style.display='flex';
  $('logoCanal').innerHTML=(c.logo?`<img src="${c.logo}">`:'')+`<span>${c.nombre||''}</span>`;
  $('ahora').textContent=c.ahora||'No hay información disponible';
  $('siguiente').textContent=c.siguiente||'No hay información disponible';
  render();
}

// NAVEGACIÓN POR TECLADO
document.addEventListener('keydown',e=>{
  if(!canales.length)return;
  switch(e.key){
    case 'ArrowUp':
      e.preventDefault();
      sel=(sel-1+canales.length)%canales.length;
      play(canales[sel]); break;          // cambia y reproduce de volada
    case 'ArrowDown':
      e.preventDefault();
      sel=(sel+1)%canales.length;
      play(canales[sel]); break;
    case 'ArrowLeft':
      e.preventDefault();
      sel=(sel-1+canales.length)%canales.length;
      play(canales[sel]); break;
    case 'ArrowRight':
      e.preventDefault();
      sel=(sel+1)%canales.length;
      play(canales[sel]); break;
    case 'Enter':
      e.preventDefault();play(canales[sel]);break;
    case 'f':case 'F':
      e.preventDefault();
      let f=JSON.parse(localStorage.getItem('nubaraPlayFavoritos')||'[]');
      const cur=canales[sel];
      if(f.includes(cur.id))f=f.filter(x=>x!==cur.id);else f.push(cur.id);
      localStorage.setItem('nubaraPlayFavoritos',JSON.stringify(f));break;
    case 'l':case 'L':
      e.preventDefault();$('lista').style.visibility=$('lista').style.visibility==='hidden'?'visible':'hidden';break;
    case 'Escape':
      e.preventDefault();
      if(document.fullscreenElement)document.exitFullscreen();
      else $('player').requestFullscreen().catch(()=>{});break;
  }
});

render();
</script>
</body>
</html>
