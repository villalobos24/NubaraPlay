<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NubaraPlay IPTV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --sidebar-bg:#12121a;
  --surface:#1a1a24;
  --border:#2a2a35;
  --text:#ffffff;
  --text-dim:#8a8a9a;
  --accent:#8b5cf6;
  --accent-hover:#7c3aed;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}

/* Layout principal: Sidebar izquierdo + Contenido derecho */
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}

/* ===== SIDEBAR IZQUIERDO (Lista de canales) ===== */
.sidebar{
  background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.sidebar-header{
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.sidebar-title{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.sidebar-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim)}

.search-box{padding:16px 20px;border-bottom:1px solid var(--border)}
.search-input{
  width:100%;
  padding:12px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  outline:none;
  transition:border-color .2s;
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text-dim)}

.channel-list{
  flex:1;
  overflow-y:auto;
  padding:12px;
}
.channel-list::-webkit-scrollbar{width:6px}
.channel-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.channel-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 16px;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
  transition:all .2s;
  border:2px solid transparent;
  position:relative;
}
.channel-item:hover{
  background:var(--surface);
  transform:translateX(4px);
}
.channel-item.focused{
  background:rgba(139,92,246,0.15);
  border-color:var(--accent);
}
.channel-item.playing{
  background:rgba(139,92,246,0.2);
  border-color:var(--accent);
}
.channel-item.playing::before{
  content:'▶';
  position:absolute;
  right:14px;
  color:var(--accent);
  font-size:12px;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

.channel-number{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:700;
  color:var(--text-dim);
  min-width:28px;
  text-align:center;
}
.channel-item.playing .channel-number{color:var(--accent)}

.channel-logo{
  width:48px;
  height:36px;
  background:var(--surface);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.channel-logo img{max-width:90%;max-height:90%;object-fit:contain}

.channel-info{flex:1;min-width:0}
.channel-name{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:2px;
}
.channel-category{
  font-size:11px;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:0.5px;
}

/* ===== CONTENIDO DERECHO (Reproductor + Info) ===== */
.content{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Header superior */
.topbar{
  padding:16px 24px;
  background:var(--sidebar-bg);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.topbar-actions{display:flex;gap:12px;align-items:center}
.topbar-btn{
  padding:8px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text-dim);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:all .2s;
}
.topbar-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.user-info{display:flex;align-items:center;gap:12px}
.user-badge{
  padding:4px 12px;
  background:var(--accent);
  color:#fff;
  border-radius:4px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
}
.clock{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text-dim)}

/* Área del reproductor */
.player-area{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:24px;
  gap:20px;
  overflow:hidden;
}

.player-wrapper{
  position:relative;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  aspect-ratio:16/9;
  max-height:calc(100vh - 320px);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  border:1px solid var(--border);
}
.player-wrapper iframe{width:100%;height:100%;border:none}

.player-empty{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:linear-gradient(135deg,#1a1a24 0%,#0a0a0f 100%);
}
.player-empty .icon{font-size:64px;opacity:0.3}
.player-empty .text{font-size:16px;color:var(--text-dim)}
.player-empty .subtext{font-size:13px;color:var(--text-dim);opacity:0.6}

.loading-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:16px;
  backdrop-filter:blur(10px);
}
.loading-overlay.active{display:flex}
.loader{
  width:60px;
  height:60px;
  border:4px solid rgba(139,92,246,0.2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--accent);font-weight:600;letter-spacing:1px}

/* Info del canal (barra inferior) */
.channel-info-bar{
  background:var(--sidebar-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.channel-info-logo{
  width:64px;
  height:48px;
  background:var(--surface);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.channel-info-logo img{max-width:90%;max-height:90%;object-fit:contain}
.channel-info-details{flex:1}
.channel-info-name{font-size:20px;font-weight:700;margin-bottom:4px}
.channel-info-meta{display:flex;gap:20px;font-size:13px;color:var(--text-dim)}
.channel-info-meta span{display:flex;align-items:center;gap:6px}
.channel-info-meta strong{color:var(--text);font-weight:600}

/* Controles */
.controls{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 4px;
  flex-wrap:wrap;
}
.ctrl-btn{
  padding:10px 18px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  gap:8px;
}
.ctrl-btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.ctrl-btn:active{transform:translateY(0)}
.ctrl-btn.primary{background:var(--accent);border-color:var(--accent)}
.ctrl-btn.primary:hover{background:var(--accent-hover)}
.ctrl-btn kbd{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  padding:2px 6px;
  background:rgba(255,255,255,0.1);
  border-radius:3px;
  color:var(--text-dim);
}
.zoom-control{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
}
.zoom-control button{
  width:28px;
  height:28px;
  background:transparent;
  border:none;
  color:var(--text);
  cursor:pointer;
  border-radius:4px;
  font-size:16px;
  font-weight:700;
}
.zoom-control button:hover{background:var(--accent)}
.zoom-control span{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  min-width:48px;
  text-align:center;
  font-weight:600;
}

/* Categorías */
.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:0 4px;
}
.cat-chip{
  padding:8px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  color:var(--text-dim);
  cursor:pointer;
  transition:all .2s;
}
.cat-chip:hover{border-color:var(--accent);color:var(--text)}
.cat-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Keyboard hints */
.kbd-bar{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:16px;
  padding:10px 20px;
  background:rgba(18,18,26,0.95);
  border:1px solid var(--border);
  border-radius:8px;
  backdrop-filter:blur(10px);
  font-size:11px;
  color:var(--text-dim);
  z-index:100;
}
.kbd-bar span{display:flex;align-items:center;gap:6px}
.kbd-bar kbd{
  font-family:'JetBrains Mono',monospace;
  padding:2px 6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:3px;
  color:var(--text);
  font-size:10px;
}

/* Responsive */
@media(max-width:1200px){
  .app{grid-template-columns:280px 1fr}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{max-height:40vh}
  .kbd-bar{display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR IZQUIERDO: Lista de canales -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📺 Canales</div>
      <div class="sidebar-count" id="channelCount">0</div>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar canal...">
    </div>
    <div class="channel-list" id="channelList"></div>
  </aside>

  <!-- CONTENIDO DERECHO: Reproductor + Info -->
  <div class="content">
    <!-- Header superior -->
    <header class="topbar">
      <div class="logo">Nubara<span>Play</span></div>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnVolver">← Volver</button>
        <button class="topbar-btn" id="btnHistorial">Historial</button>
      </div>
      <div class="user-info">
        <span class="user-badge" id="userInfo">USUARIO</span>
        <span class="clock" id="clock">--:--</span>
      </div>
    </header>

    <!-- Área del reproductor -->
    <div class="player-area">
      <div class="player-wrapper" id="playerWrapper">
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loader"></div>
          <div class="loading-text">CARGANDO...</div>
        </div>
        <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <div class="player-empty" id="playerEmpty">
          <div class="icon">📡</div>
          <div class="text">Selecciona un canal</div>
          <div class="subtext">Usa ↑↓ para navegar · Enter para reproducir</div>
        </div>
      </div>

      <!-- Info del canal actual -->
      <div class="channel-info-bar" id="channelInfoBar">
        <div class="channel-info-logo">
          <img id="infoLogo" src="" alt="">
        </div>
        <div class="channel-info-details">
          <div class="channel-info-name" id="infoName">Sin canal seleccionado</div>
          <div class="channel-info-meta">
            <span>Categoría: <strong id="infoCategory">-</strong></span>
            <span>Visitas: <strong id="infoVisits">0</strong></span>
          </div>
        </div>
      </div>

      <!-- Controles -->
      <div class="controls">
        <button class="ctrl-btn" id="btnPrev">⏮ Anterior <kbd>←</kbd></button>
        <button class="ctrl-btn" id="btnNext">Siguiente ⏭ <kbd>→</kbd></button>
        <button class="ctrl-btn" id="btnMute">🔊 <kbd>M</kbd></button>
        <div class="zoom-control">
          <button id="btnZoomOut">−</button>
          <span id="zoomVal">100%</span>
          <button id="btnZoomIn">+</button>
        </div>
        <button class="ctrl-btn" id="btnFav">☆ Favorito <kbd>F</kbd></button>
        <button class="ctrl-btn primary" id="btnFullscreen">⛶ Pantalla Completa</button>
      </div>

      <!-- Categorías -->
      <div class="categories" id="categories"></div>
    </div>
  </div>
</div>

<div class="kbd-bar">
  <span><kbd>↑</kbd><kbd>↓</kbd> Navegar</span>
  <span><kbd>←</kbd><kbd>→</kbd> Cambiar canal</span>
  <span><kbd>Enter</kbd> Reproducir</span>
  <span><kbd>M</kbd> Mute</span>
  <span><kbd>F</kbd> Favorito</span>
  <span><kbd>Esc</kbd> Salir</span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);

// Auth
const savedUser=localStorage.getItem('nubaraPlayUser');
if(!savedUser){window.location.href='index.html'}
else{$('userInfo').textContent=JSON.parse(savedUser).tipo==='demo'?'DEMO':'PREMIUM'}
$('btnSalir')?.addEventListener('click',()=>{localStorage.removeItem('nubaraPlayUser');location.href='index.html'});
$('btnVolver').onclick=()=>history.back();

// Firebase
const firebaseConfig={apiKey:"AIzaSyAEw7jfxJxbF3r5YvftUD6yJwpyEMmg9tQ",authDomain:"nubaraplay.firebaseapp.com",projectId:"nubaraplay",storageBucket:"nubaraplay.firebasestorage.app",messagingSenderId:"873822057409",appId:"1:873822057409:web:f854a974f457eedd0c7540"};
try{firebase.initializeApp(firebaseConfig)}catch(e){}
const db=firebase.firestore();

// State
let channels=[],events=[];
let currentView='tv',currentCat='Todos',searchQuery='';
let zoom=100,muted=false,playingId=null,focusedIndex=0;

const getFavs=()=>JSON.parse(localStorage.getItem('nubaraPlayFavoritos')||'[]');
const getHist=()=>JSON.parse(localStorage.getItem('nubaraPlayHistorial')||'[]');

// Clock
function tickClock(){const d=new Date();let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;$('clock').textContent=h+':'+m+' '+ap}
setInterval(tickClock,1000);tickClock();

// Data
db.collection('canales').onSnapshot(snap=>{
  channels=[];
  snap.forEach(doc=>{const c=doc.data();if(c.categoria==='Peliculas')return;channels.push({id:doc.id,...c})});
  renderCategories();renderChannels();
},err=>console.error('Error:',err));

db.collection('agenda').onSnapshot(snap=>{
  events=[];snap.forEach(doc=>events.push({id:doc.id,...doc.data()}));
},err=>console.error('Error:',err));

// Categories
function renderCategories(){
  const cats=['Todos',...[...new Set(channels.map(c=>c.categoria).filter(Boolean))].sort()];
  const box=$('categories');box.innerHTML='';
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-chip'+(cat===currentCat?' active':'');
    btn.textContent=cat;
    btn.onclick=()=>{currentCat=cat;renderCategories();renderChannels()};
    box.appendChild(btn);
  });
}

// Channels
function getFilteredChannels(){
  let list=currentView==='destacados'?channels.filter(c=>getFavs().includes(c.id)):
           currentView==='historial'?getHist().map(x=>channels.find(c=>c.id===x.id)).filter(Boolean):
           channels.filter(c=>currentCat==='Todos'||c.categoria===currentCat);
  if(searchQuery)list=list.filter(c=>(c.nombre||'').toLowerCase().includes(searchQuery));
  return list;
}

function renderChannels(){
  const list=getFilteredChannels();
  $('channelCount').textContent=list.length;
  const box=$('channelList');box.innerHTML='';
  
  if(!list.length){box.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">No hay canales</div>';return}
  
  list.forEach((ch,i)=>{
    const item=document.createElement('div');
    item.className='channel-item'+(ch.id===playingId?' playing':'')+(i===focusedIndex?' focused':'');
    item.innerHTML=`
      <div class="channel-number">${i+1}</div>
      <div class="channel-logo"><img src="${ch.logo||''}" onerror="this.src='https://via.placeholder.com/120x90/1a1a24/8a8a9a?text=TV'"></div>
      <div class="channel-info">
        <div class="channel-name">${ch.nombre}</div>
        <div class="channel-category">${ch.categoria||'TV'}</div>
      </div>
    `;
    item.onclick=()=>{focusedIndex=i;playChannel(ch)};
    item.onmouseenter=()=>{focusedIndex=i;updateFocus()};
    box.appendChild(item);
  });
}

function updateFocus(){
  const items=$('channelList').querySelectorAll('.channel-item');
  items.forEach((it,i)=>{
    it.classList.toggle('focused',i===focusedIndex);
    if(i===focusedIndex)it.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}

// Play channel
function playChannel(ch){
  playingId=ch.id;
  $('playerEmpty').style.display='none';
  $('loadingOverlay').classList.add('active');
  
  // Update info bar
  $('infoName').textContent=ch.nombre;
  $('infoCategory').textContent=ch.categoria||'TV';
  $('infoVisits').textContent=ch.visitas||0;
  $('infoLogo').src=ch.logo||'';
  
  // Load iframe
  $('playerFrame').src=ch.url||'';
  
  setTimeout(()=>$('loadingOverlay').classList.remove('active'),2000);
  
  // History
  let h=getHist().filter(x=>x.id!==ch.id);
  h.unshift({id:ch.id,nombre:ch.nombre,logo:ch.logo,url:ch.url,ts:Date.now()});
  localStorage.setItem('nubaraPlayHistorial',JSON.stringify(h.slice(0,20)));
  
  // Visits
  if(channels.some(c=>c.id===ch.id))
    db.collection('canales').doc(ch.id).update({visitas:(ch.visitas||0)+1}).catch(()=>{});
  
  renderChannels();
}

// Navigation - INSTANT
function navigate(dir){
  const list=getFilteredChannels();
  if(!list.length)return;
  focusedIndex=(focusedIndex+dir+list.length)%list.length;
  updateFocus();
  playChannel(list[focusedIndex]);
}

// Controls
$('btnPrev').onclick=()=>navigate(-1);
$('btnNext').onclick=()=>navigate(1);
$('btnMute').onclick=()=>{muted=!muted;$('btnMute').innerHTML=muted?'🔇 <kbd>M</kbd>':'🔊 <kbd>M</kbd>'};
$('btnZoomIn').onclick=()=>{zoom=Math.min(200,zoom+10);$('playerFrame').style.transform=`scale(${zoom/100})`;$('zoomVal').textContent=zoom+'%'};
$('btnZoomOut').onclick=()=>{zoom=Math.max(50,zoom-10);$('playerFrame').style.transform=`scale(${zoom/100})`;$('zoomVal').textContent=zoom+'%'};
$('btnFullscreen').onclick=()=>{const el=$('playerWrapper');if(!document.fullscreenElement)el.requestFullscreen();else document.exitFullscreen()};
$('btnFav').onclick=()=>{
  if(!playingId)return;
  let f=getFavs();const i=f.indexOf(playingId);
  if(i>-1)f.splice(i,1);else f.push(playingId);
  localStorage.setItem('nubaraPlayFavoritos',JSON.stringify(f));
  $('btnFav').innerHTML=f.includes(playingId)?'★ Favorito <kbd>F</kbd>':'☆ Favorito <kbd>F</kbd>';
};

// Search
$('searchInput').oninput=e=>{searchQuery=e.target.value.toLowerCase();focusedIndex=0;renderChannels()};

// KEYBOARD NAVIGATION
document.addEventListener('keydown',e=>{
  if(document.activeElement===$('searchInput')){
    if(e.key==='Escape'){$('searchInput').blur();searchQuery='';$('searchInput').value='';renderChannels()}
    return;
  }

  const list=getFilteredChannels();
  
  switch(e.key){
    case 'ArrowUp':
      e.preventDefault();
      focusedIndex=focusedIndex<=0?list.length-1:focusedIndex-1;
      updateFocus();
      break;
    case 'ArrowDown':
      e.preventDefault();
      focusedIndex=focusedIndex>=list.length-1?0:focusedIndex+1;
      updateFocus();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      navigate(-1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      navigate(1);
      break;
    case 'Enter':
      e.preventDefault();
      if(focusedIndex>=0&&focusedIndex<list.length)playChannel(list[focusedIndex]);
      break;
    case 'm':case 'M':
      e.preventDefault();$('btnMute').click();break;
    case 'f':case 'F':
      e.preventDefault();$('btnFav').click();break;
    case 'Escape':
      e.preventDefault();
      if(document.fullscreenElement)document.exitFullscreen();
      break;
  }
});

// Init
renderCategories();
renderChannels();
</script>
</body>
</html>
